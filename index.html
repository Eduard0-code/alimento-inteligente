<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chef Local - Edição noNode</title>
        <!-- Bootstrap 5.3 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
        <!-- Ficheiro CSS Externo -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
        <div class="container">
            <header class="header-section">
                <div class="chef-icon">👨‍🍳</div>
                <h1 class="fw-black mb-1" style="font-size: 3rem; letter-spacing: -1px;">Chef Local</h1>
                <p class="text-muted fw-medium">Pratos principais, doces e bolos com o que tem em casa.</p>
            </header>
            
            <div class="card main-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="text-uppercase fw-black text-warning small tracking-widest mb-0">O seu Inventário</h6>
                <button id="btn-limpar-tudo" class="btn btn-link btn-sm text-danger text-decoration-none fw-bold p-0 d-none">
                    Esvaziar Tudo ×
                </button>
            </div>

            <form id="form-ingrediente" class="ingredient-input-group mb-4">
                <span class="d-flex align-items-center ps-3 text-muted">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </span>
                <input type="text" id="ingrediente-input" class="form-control" placeholder="Ex: pão, leite, açúcar, chocolate..." autocomplete="off">
                <button type="submit" id="btn-adicionar" class="btn btn-warning btn-adicionar text-white shadow-sm">Adicionar</button>
            </form>

            <div id="lista-tags" class="d-flex flex-wrap"></div>
        </div>
        
        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-end mb-4 px-2">
                <h4 id="status-busca" class="fw-black mb-0 text-dark">Aguardando ingredientes...</h4>
                <span id="contador-receitas" class="badge rounded-pill bg-white text-dark border shadow-sm px-4 py-2 fw-bold">0 Receitas</span>
            </div>
            <div id="grid-receitas" class="row g-4"></div>
        </section>
    </div>

    <!-- Modal Detalhes -->
    <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow-lg">
                <div class="modal-header d-block border-0 pb-0">
                    <div class="d-flex justify-content-between align-items-start p-4 pb-0">
                        <h2 id="modal-titulo" class="fw-black mb-0 text-dark" style="letter-spacing: -1px;"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="px-4 mt-2">
                        <span id="modal-tempo" class="badge bg-warning-subtle text-warning border border-warning-subtle px-3 py-2"></span>
                        <span id="modal-falta-aviso" class="badge ms-2 px-3 py-2 border"></span>
                    </div>
                </div>
                <div class="modal-body p-4">
                    <div id="modal-conteudo"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Ficheiro JS Externo -->
    <script src="script.js"></script>
</body>
</html>
